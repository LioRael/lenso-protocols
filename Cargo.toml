[workspace]
resolver = "2"
members = [
    "crates/lenso-contract-authoring",
    "crates/lenso-contract-authoring-macros",
    "crates/lenso-contract-codegen",
    "crates/lenso-contract-runtime",
    "crates/lenso-module-authoring",
    "crates/lenso-process-protocol",
    "fixtures/event-contract/rust",
    "fixtures/portable-contract/rust",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-protocols"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22"
bytes = "1.12"
futures = "0.3"
hmac = "0.12"
schemars = "1.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
