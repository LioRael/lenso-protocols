[workspace]
release_always = false
changelog_update = false
git_tag_name = "{{ package }}-v{{ version }}"
pr_labels = ["release"]

# These packages remain publishable, but their current releases depend on the
# missing Trusted Publishers being authorized on crates.io. Keep them out of
# the automated queue so they cannot block independently releasable crates.
[[package]]
name = "lenso-contract-authoring"
release = false

[[package]]
name = "lenso-contract-codegen"
release = false

[[package]]
name = "lenso-process-protocol"
release = false
