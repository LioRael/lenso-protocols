name: Release npm package

on:
  push:
    tags:
      - "lenso-contract-runtime-ts-v*"
      - "lenso-process-protocol-ts-v*"

permissions: {}

jobs:
  publish:
    name: Publish selected npm package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Select package from release tag
        run: |
          case "$GITHUB_REF_NAME" in
            lenso-contract-runtime-ts-v*)
              echo "PACKAGE_DIR=packages/lenso-contract-runtime" >> "$GITHUB_ENV"
              echo "TAG_PREFIX=lenso-contract-runtime-ts-v" >> "$GITHUB_ENV"
              ;;
            lenso-process-protocol-ts-v*)
              echo "PACKAGE_DIR=packages/lenso-process-protocol" >> "$GITHUB_ENV"
              echo "TAG_PREFIX=lenso-process-protocol-ts-v" >> "$GITHUB_ENV"
              ;;
            *) exit 1 ;;
          esac
      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          test "$GITHUB_REF_NAME" = "${TAG_PREFIX}${package_version}"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Verify package
        run: |
          bun run build
          bun run typecheck
          bun run package-smoke
          bun run test
          package_tarball="$(npm pack --json --ignore-scripts "./${PACKAGE_DIR}" --pack-destination "$RUNNER_TEMP" | jq -r '.[0].filename')"
          test -n "$package_tarball"
          test -f "$RUNNER_TEMP/$package_tarball"
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/$package_tarball" >> "$GITHUB_ENV"
      - name: Publish package
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance
